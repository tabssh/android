plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // kotlinx.serialization compiler plugin. Without this, @Serializable
    // is just an annotation — no companion serializer is generated, and
    // Json.encodeToString blows up at runtime with "Serializer for class
    // X is not found." Sync upload was the only path exercising reified
    // serializers so the breakage was latent until the SAF upload ran.
    // The version MUST match `kotlin_version` in the root build.gradle.
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
    id 'com.google.devtools.ksp'
    id 'jacoco'
    // CycloneDX SBOM generation — release channels attach {project}-sbom.cdx.json
    id 'org.cyclonedx.bom' version '3.4.1'
}

// Termux terminal-emulator version — single source shared by the runtime
// dependency (see dependencies{}) and the TERMINAL_EMULATOR_VERSION BuildConfig
// field the About dialog reports. Change in one place.
def termuxTerminalVersion = 'v0.118.1'

// Resolve a build-time identifier for the current source. Preference:
//   1. `git rev-parse --short=7 HEAD` — works on dev machines AND F-Droid's
//      builder (fdroidserver clones via git and checks out the recipe's
//      commit SHA, so HEAD is the exact commit being built).
//   2. release.txt contents — fallback when .git is absent (source
//      tarballs, IDE imports without git history).
//   3. "unknown" — last-resort sentinel.
// Short SHA only — avoid `--dirty` or timestamps which break F-Droid
// reproducibility (a stray file in the build dir would diverge HEAD).
// Length pinned to 7 (`--short=7`, GitHub's own standard short-SHA length;
// GitLab's is 8) so every identifier across the project (this BuildConfig
// field, the devel-* release tag) is the same length — plain `--short`
// grows past 7 chars once the repo needs more to stay unambiguous,
// producing inconsistent lengths release to release.
def resolveGitCommit = {
    try {
        def execResult = providers.exec {
            commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
            ignoreExitValue = true
        }
        def s = execResult.standardOutput.asText.get().trim()
        if (s) return s
    } catch (Exception ignored) {}
    try {
        def f = file("${rootDir}/release.txt")
        if (f.exists()) return f.text.trim()
    } catch (Exception ignored) {}
    return "unknown"
}

// Deterministic build timestamp (seconds since epoch) for F-Droid reproducible
// builds. A wall-clock `new Date()` makes bit-for-bit reproduction impossible,
// so resolve a stable source instead:
//   1. SOURCE_DATE_EPOCH — the reproducible-builds standard; F-Droid sets it.
//   2. the last commit's author timestamp — deterministic for a given checkout.
//   3. 0 (1970-01-01 UTC) — last resort for a git-less, env-less tarball build;
//      still reproducible.
// providers.exec keeps this configuration-cache compatible (same as resolveGitCommit).
def resolveBuildEpochSeconds = {
    def sde = System.getenv("SOURCE_DATE_EPOCH")
    if (sde != null && sde.isLong()) return sde.toLong()
    try {
        def execResult = providers.exec {
            commandLine 'git', 'log', '-1', '--format=%ct'
            ignoreExitValue = true
        }
        def s = execResult.standardOutput.asText.get().trim()
        if (s && s.isLong()) return s.toLong()
    } catch (Exception ignored) {}
    return 0L
}

android {
    namespace 'io.github.tabssh'
    compileSdk 35

    // Pinned to a version baked into the toolchain image (AI.md PART 4):
    // leaving it to the AGP default lets a Gradle/AGP bump silently trigger a
    // mid-build sdkmanager download, which is nondeterministic and a known CI
    // flake. Bump this and docker/Dockerfile.build together.
    buildToolsVersion '35.0.0'

    // F-Droid builder detection. The recipe in metadata/io.github.tabssh.yml
    // writes `org.gradle.project.fdroidBuild=true` into gradle.properties in
    // its prebuild step. When set: ABI splits are disabled (F-Droid expects a
    // single deterministic APK per build) and the fdroidRelease build type
    // produces an unsigned APK (F-Droid signs with its own key). Local and CI
    // builds never set the property, so their behavior is unchanged.
    def isFdroidBuild = (findProperty('fdroidBuild') ?: 'false').toString().toBoolean()

    defaultConfig {
        applicationId "io.github.tabssh"
        // Android 7.0. Raised from 21 to eliminate a class of latent
        // NewApi crashes: dozens of API 22-24 calls (ThreadLocal.withInitial,
        // ConcurrentHashMap.newKeySet, SNIHostName, KeyGenParameterSpec,
        // Context#getColor, the 'X' date pattern, removeIf) were invoked
        // unguarded under minSdk 21 and would throw NoSuchMethodError on
        // Android 5.0-6.0. minSdk 24 still covers ~96% of active devices.
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Enable vector drawables
        vectorDrawables.useSupportLibrary = true

        // Multi-architecture support for all Android devices. This also
        // scopes which per-ABI jniLibs are packaged — including the SPICE
        // native library `libtabssh_native.so`, which is cross-compiled
        // out-of-tree (see deps/spice/Dockerfile + deps/spice/build-android.sh) and
        // fetched into app/src/main/jniLibs/<abi>/ by
        // scripts/fetch-spice-libs.sh at build time, exactly like the mosh
        // client. The APK build itself runs no native toolchain; when the
        // prebuilt is absent the SpiceLoader gate disables SPICE at runtime
        // and falls back to VNC.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        // Build information - version, commit ID, and build date
        buildConfigField "String", "VERSION_NAME", "\"${versionName}\""
        buildConfigField "int", "VERSION_CODE", "${versionCode}"
        buildConfigField "String", "GIT_COMMIT_ID", "\"${resolveGitCommit()}\""
        buildConfigField "String", "BUILD_DATE", "\"" + { ->
            def fmt = new java.text.SimpleDateFormat("MM/dd/yyyy 'at' HH:mm:ss", java.util.Locale.US)
            fmt.setTimeZone(java.util.TimeZone.getTimeZone("UTC"))
            fmt.format(new java.util.Date(resolveBuildEpochSeconds() * 1000L))
        }() + "\""
        buildConfigField "String", "FULL_VERSION", "\"${versionName} (${versionCode})\""
        // Build epoch (seconds, UTC) captured once per build; the fdroidRelease
        // flavor resolves it to the last-commit epoch for reproducibility
        buildConfigField "long", "BUILD_EPOCH", "${resolveBuildEpochSeconds()}L"
        // Termux terminal-emulator version, surfaced in the About dialog's
        // bundled-components list. Sourced from termuxTerminalVersion above.
        buildConfigField "String", "TERMINAL_EMULATOR_VERSION", "\"${termuxTerminalVersion}\""
    }

    signingConfigs {
        // Credentials come from the environment only — no hardcoded fallback
        // password. A literal password fallback in a public repo defeats the
        // point of a "secret": anyone who reads this file can sign an update
        // that Android will accept in place of the real release. When unset,
        // storePassword/keyPassword resolve to null and the taskGraph check
        // below fails the build by name before any signing task runs, instead
        // of silently signing with a known password.
        release {
            // KEYSTORE_PATH lets a local or CI build point at a throwaway
            // keystore (emulator UI runs, reproducibility checks) without
            // moving or overwriting the real one sitting at the repo root.
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "../keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEYSTORE_ALIAS") ?: "tabssh"
            // A keystore created with -storepass and no separate -keypass
            // gives the key the store's password, so KEY_PASSWORD is optional
            // and falls back to KEYSTORE_PASSWORD. This is a fallback between
            // two secrets, not to a literal, so the point above still holds.
            keyPassword System.getenv("KEY_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
        }
    }

    buildTypes {
        debug {
            // No applicationIdSuffix: debug builds must be able to update an
            // installed release build (they share the release signing config).
            debuggable true
            minifyEnabled false
            buildConfigField "boolean", "DEBUG_LOG", "true"
            buildConfigField "String", "BUILD_TYPE", '"debug"'

            // Use the same keystore as release for consistent signing
            signingConfig signingConfigs.release
        }
        
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            // AI.md PART 4/13: `devel` is the variant that enables the Debug
            // Log. Shipped release builds always have it off.
            buildConfigField "boolean", "DEBUG_LOG", "false"
            buildConfigField "String", "BUILD_TYPE", '"release"'

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
        }
        
        devel {
            initWith release
            // Development channel (AI.md PART 4/13): release configuration —
            // R8, shrinkResources, signed, NOT debuggable — with the Debug
            // Log force-enabled via BuildConfig.DEBUG_LOG; BuildConfig.BUILD_TYPE
            // ("devel") identifies the channel itself, so no separate DEVEL
            // flag is needed. Logger sanitation applies here exactly as in release.
            buildConfigField "boolean", "DEBUG_LOG", "true"
            buildConfigField "String", "BUILD_TYPE", '"devel"'
            matchingFallbacks = ['release']
            signingConfig signingConfigs.release
        }

        fdroidRelease {
            initWith release
            // initWith copies DEBUG_LOG from release; re-state it here so a
            // future edit to the release stanza doesn't silently change fdroid
            // behaviour.
            buildConfigField "boolean", "DEBUG_LOG", "false"
            buildConfigField "String", "BUILD_TYPE", '"fdroid"'
            applicationIdSuffix ""
            
            // F-Droid specific optimizations
            minifyEnabled true
            shrinkResources true
            debuggable false
            
            // Use deterministic build settings for reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-fdroid.pro'

            // On the F-Droid builder there is no keystore.jks — produce an
            // unsigned APK and let F-Droid sign with its own key. Local/CI
            // smoke builds (no fdroidBuild property) keep the release keystore.
            signingConfig isFdroidBuild ? null : signingConfigs.release
        }
    }
    
    // APK splits for multi-architecture releases. Disabled on the F-Droid
    // builder (fdroidBuild=true) — F-Droid builds one APK per recipe entry,
    // so the fdroid build emits a single universal APK instead.
    splits {
        abi {
            enable !isFdroidBuild
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
            universalApk true // Also create a universal APK
        }
    }

    packaging {
        jniLibs {
            // The mosh client ships as app/src/main/jniLibs/*/libmosh-client.so
            // and is exec()'d from applicationInfo.nativeLibraryDir at runtime
            // (MoshNativeClient.resolveBinary). With AGP 8 + minSdk 24,
            // android:extractNativeLibs defaults to false, so .so files stay
            // mmap'd inside the APK and never land on disk as executable files
            // — resolveBinary() then returns null and we fall back to the
            // "install termux/mosh" handoff. useLegacyPackaging=true forces
            // extraction to nativeLibraryDir so the built-in binary is usable.
            useLegacyPackaging = true

            // F-Droid builds everything from source (no prebuilt binaries) —
            // libmosh-client.so, libtabssh_native.so (SPICE), and libtor.so
            // are cross-compiled out-of-tree and fetched over the network by
            // scripts/fetch-{mosh,spice,tor}-binaries.sh in the other release
            // channels, which F-Droid's build recipe never runs. Excluding
            // them here too means the fdroidRelease flavor can never ship a
            // prebuilt binary even if a local/CI smoke build already
            // populated jniLibs/ before assembling this flavor. Each feature
            // gates gracefully at runtime when its .so is absent — SpiceLoader
            // falls back to VNC, MoshNativeClient falls back to the
            // install-termux/mosh handoff, TorNativeClient.isAvailable()
            // reports false — so the fdroid build is a real, working reduced
            // feature set, not a broken one.
            if (isFdroidBuild) {
                excludes += [
                    '**/libmosh-client.so',
                    '**/libtabssh_native.so',
                    '**/libtor.so',
                ]
            }
        }
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                // BC 1.78+ and JSch both ship multi-release OSGi
                // manifests at META-INF/versions/{9,15,...}/OSGI-INF/
                // (build-time metadata, not runtime). We don't run as
                // an OSGi bundle, so drop them all.
                'META-INF/versions/**/OSGI-INF/MANIFEST.MF',
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    
    // Lint configuration
    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'InvalidPackage'

        // Community translations are perpetually incomplete; a missing
        // per-locale string falls back to the base locale at runtime, so
        // this is a translation-coverage gap, not a code defect. Keep it
        // visible as a warning but don't fail the lint gate on it.
        warning 'MissingTranslation'

        // NOTE: do NOT use `checkOnly` here. `checkOnly` *replaces* the entire
        // default check set with only the listed IDs, which silently disabled
        // NewApi (the check that would have caught java.util.Base64 under
        // minSdk 21) and hundreds of others. The full default set must run;
        // `enable` below only *adds* the security and accessibility checks that
        // are off or advisory by default.

        // Security-focused lint checks — promoted so they always run.
        enable 'SecureRandom', 'TrustAllX509TrustManager', 'BadHostnameVerifier', 'SSLCertificateSocketFactoryCreateSocket'

        // Accessibility checks. `TouchTargetSize` is not a real lint
        // issue id — it was removed in AGP 8.x. Was emitting an
        // [UnknownIssueId] warning. Real touch-target sizing is now
        // covered by Material's own min-height attributes in styles.
        enable 'ContentDescription', 'ClickableViewAccessibility'
    }
    
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Argon2id derivations in the sync/backup tests each claim 64 MiB of
            // Java heap; the default fork heap is too small to run them
            maxHeapSize = '2g'
            jacoco {
                includeNoLocationClasses = true
                excludes = ['jdk.internal.*']
            }
        }
        // Disable APK splits for unit tests (they expect single APK)
        unitTests.returnDefaultValues = true
    }

    // Unified release naming: tabssh-{platform}-{arch}.apk
    //
    // Maps the canonical Android ABI names to the simplified arch tags
    // shared with the desktop client and the stable release workflow:
    //   arm64-v8a   → arm64
    //   armeabi-v7a → arm
    //   x86_64      → amd64
    //   x86         → x86
    //   (universal) → universal  (no ABI filter)
    //
    // The CI dev workflow appends "-dev" before .apk; the stable workflow
    // appends "-${VERSION}".
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abiName = output.getFilter(com.android.build.OutputFile.ABI) ?: "universal"
            def archTag = [
                'arm64-v8a'  : 'arm64',
                'armeabi-v7a': 'arm',
                'x86_64'     : 'amd64',
                'x86'        : 'x86',
            ][abiName] ?: abiName
            outputFileName = "tabssh-android-${archTag}.apk"
        }
    }

}

// Fail fast — before any packaging task runs — when a variant that signs
// with signingConfigs.release (debug, release, devel, and fdroidRelease's
// CI smoke build) is requested but KEYSTORE_PASSWORD is missing,
// instead of letting AGP fail deep inside the packaging task with
// an opaque keystore error. The real F-Droid builder sets fdroidBuild=true,
// which nulls out fdroidRelease's signingConfig entirely (see
// android.buildTypes.fdroidRelease above), so it never needs these
// variables. Tasks that don't package an APK (compile, lint, unit tests —
// `make check`) never touch signingConfigs.release and are unaffected.
def isFdroidSigningCheckBuild = (findProperty('fdroidBuild') ?: 'false').toString().toBoolean()
gradle.taskGraph.whenReady { graph ->
    def needsReleaseSigning = !isFdroidSigningCheckBuild && graph.allTasks.any { task ->
        // Match on task type, not task name. AGP names a lot of things
        // "packageDebug*" that never sign anything — packageDebugResources,
        // packageDebugAssets, packageDebugUnitTestForUnitTest — and any
        // name-based match kept failing `make check` on a machine with no
        // keystore passwords. PackageApplication is the task that signs an
        // APK; FinalizeBundleTask is the one that signs an AAB.
        def type = task.class.name
        type.contains('PackageApplication') || type.contains('FinalizeBundleTask')
    }
    if (needsReleaseSigning) {
        def missing = []
        // KEY_PASSWORD is deliberately not required — signingConfigs.release
        // falls back to KEYSTORE_PASSWORD for it (see above).
        if (!System.getenv("KEYSTORE_PASSWORD")) missing << "KEYSTORE_PASSWORD"
        if (missing) {
            throw new GradleException(
                "Cannot sign this build: missing required environment " +
                "variable(s) ${missing.join(', ')}. Set them (see " +
                "scripts/generate-keystore.sh) before building a signed " +
                "debug/release/devel APK."
            )
        }
    }
}

ksp {
    // Tell Room where to write the exported schema JSON files.
    // With exportSchema = true in @Database, KSP writes one JSON file per
    // DB version so migrations can be verified at compile time against the
    // expected schema. The files are committed to source control.
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    // Android Support
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // SSH Implementation - Using maintained fork with security fixes
    // https://github.com/mwiede/jsch - Actively maintained, OpenSSH 8.8+ compatible
    implementation 'com.github.mwiede:jsch:2.27.7'
    
    // Security
    // Credential encryption uses AndroidKeyStore + AES/GCM directly
    // (SecurePasswordManager); androidx.security:security-crypto was declared
    // but never referenced, so it is intentionally omitted — removing its
    // alpha Tink dependency off the credential path.
    implementation 'androidx.biometric:biometric:1.1.0'

    // JSR-305 annotations — supply javax.annotation.* referenced by OkHttp so
    // R8 does not warn (see the -dontwarn/-keep javax.annotation rules).
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    
    // Cryptography - BouncyCastle for comprehensive PEM parsing
    // BouncyCastle 1.78 fixes CVE-2024-29857 (ECDSA timing), CVE-2024-30171
    // (RSA PKCS#1 padding oracle), CVE-2024-30172 (Ed25519 signature
    // verification), all of which we exercise via SSHKeyParser when
    // parsing user-supplied private keys. Pinned to 1.79 (latest stable).
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    
    // Database
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'
    
    // File operations
    implementation 'androidx.documentfile:documentfile:1.0.1'
    
    // JSON handling
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    // YAML handling — Docker run.yml single-container configs
    // (docker/runconfig). SnakeYAML's compose API exposes per-node source
    // marks, which the strict run.yml parser uses to report line numbers in
    // error messages; kaml (the kotlinx-serialization alternative) hides the
    // node layer and cannot produce field-level line diagnostics or custom
    // unknown-key hints. Only the safe compose/dump paths are used — no
    // JavaBean reflection, so no java.beans dependency on Android.
    implementation 'org.yaml:snakeyaml:2.4'
    
    // Charts - MPAndroidChart for performance graphs
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // Terminal Emulator - Termux (MIT licensed, full emoji/256-color support)
    // Using only terminal-emulator (not terminal-view)
    // We render using our own TerminalView, just need the emulation engine
    // JitPack format: com.github.termux.termux-app:module:version
    implementation("com.github.termux.termux-app:terminal-emulator:${termuxTerminalVersion}") {
        // Exclude terminal-view as we use our own TerminalView and it requires minSdk 24
        exclude group: 'com.github.termux.termux-app', module: 'terminal-view'
    }

    // Provides ListenableFuture + AbstractResolvableFuture required by profileinstaller and WorkManager.
    // The empty guava stub (9999.0-empty-to-avoid-conflict-with-guava) has no implementation and
    // causes NoClassDefFoundError at runtime.
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'

    // Wave 4.b — Jetpack WindowManager: observe FoldingFeature so foldables
    // in book mode (Galaxy Fold, Pixel Fold) can lock the drawer open as a
    // sidebar even though `is_tablet` is false on the unfolded display.
    implementation 'androidx.window:window:1.3.0'

    // Sync uses Android Storage Access Framework (SAF) - no external dependencies needed
    // Works with Google Drive app, Dropbox, OneDrive, Nextcloud, or any DocumentsProvider

    // OkHttp - used by hypervisor console WebSocket client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // QR Pairing (see AI.md §18). ZXing chosen over ML Kit Barcode so we
    // don't pull in any Google Play Services dependency — TabSSH targets
    // de-Googled ROMs as a first-class platform.
    //
    //  - zxing core: pure-Java QR decoding
    //  - zxing-android-embedded: thin Android wrapper exposing
    //    `ScanContract` + `ScanOptions` (Activity Result API integration)
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    // Maps kotlin.test.* (assertEquals/assertTrue/@Test) onto JUnit4. Every unit
    // test file uses the kotlin.test API, so without this the whole test source
    // set fails to compile ("unresolved reference kotlin.test"). Pinned to the
    // project Kotlin version so the assertion API matches the compiler.
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
    // Real org.json for local JVM unit tests — the mockable android.jar stubs
    // JSONObject/JSONArray (returnDefaultValues), which would silently break
    // the Docker transport parser tests. The real jar wins on the classpath.
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // Null-safe matchers and captors: plain Mockito's any()/capture() return
    // Java null, which Kotlin rejects for a non-null parameter before the mock
    // is ever reached ("capture(...) must not be null")
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.4.0'
    testImplementation 'androidx.room:room-testing:2.8.4'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    // Robolectric + androidx.test provide an Android runtime for local JVM unit
    // tests of classes that need a real Context / Android Keystore. Example:
    // SecurePasswordManagerTest constructs SecurePasswordManager, whose field
    // initializer calls KeyStore.getInstance("AndroidKeyStore") — that provider
    // cannot be mocked, so the test needs Robolectric's shadowed keystore and
    // SharedPreferences. testOptions.unitTests.includeAndroidResources (above)
    // was already set for exactly this Robolectric-style unit testing.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.5.1'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.5.1'
    androidTestImplementation 'androidx.room:room-testing:2.8.4'
}

// Note: Git commit ID and build date are now set directly in buildConfigField
// to avoid Gradle configuration cache issues with external process execution

// Jacoco configuration for code coverage
jacoco {
    toolVersion = "0.8.11"
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'
    
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*',
        '**/*$ViewInjector*.*',
        '**/*$ViewBinder*.*',
        '**/*_MembersInjector.class',
        '**/Dagger*Component*.*',
        '**/*Module_*Factory.class',
        '**/di/module/*',
        '**/*_Factory*.*',
        '**/*Module*.*',
        '**/*Dagger*.*',
        '**/*Hilt*.*',
        '**/databinding/**/*.*',
        '**/androidx/databinding/**/*.*'
    ]
    
    def debugTree = fileTree(dir: "${layout.buildDirectory.get().asFile}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def mainSrc = "$projectDir/src/main/java"
    
    sourceDirectories.setFrom(files([mainSrc]))
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: [
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        'jacoco/testDebugUnitTest.exec'
    ]))
}

tasks.register('jacocoTestCoverageVerification', JacocoCoverageVerification) {
    dependsOn 'testDebugUnitTest'
    
    violationRules {
        rule {
            enabled = true
            limit {
                minimum = 0.0 // Start with 0% - increase as tests are added
            }
        }
    }
    
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        'android/**/*.*'
    ]
    
    def debugTree = fileTree(dir: "${layout.buildDirectory.get().asFile}/tmp/kotlin-classes/debug", excludes: fileFilter)
    
    classDirectories.setFrom(files([debugTree]))
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: [
        'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
        'jacoco/testDebugUnitTest.exec'
    ]))
}


// Disable unit test tasks for fdroidRelease build variant (incompatible with APK splits)
afterEvaluate {
    tasks.findAll { task ->
        task.name.contains('FdroidRelease') && task.name.contains('UnitTest')
    }.each { task ->
        task.enabled = false
    }
}
