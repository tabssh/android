# GitLab CI mirror of .github/workflows/{ci,security,beta,release,devel}.yml
# (AI.md PART 12). Same gates, GitLab syntax: build/test/security stages
# cover ci.yml; devel/beta/release each get their own stage, tag- or
# schedule-triggered, running the canonical release skeleton (AI.md
# PART 13). All jobs run in casjaysdev/android:latest — no inline tool
# install.

stages:
  - build
  - test
  - security
  - release

default:
  # Pinned by digest per AI.md PART 12 / cicd_conventions.md (GitLab: no
  # `:latest` in production CI jobs) — Renovate tracks and bumps this
  # digest the same way it bumps SHA-pinned GitHub Actions.
  image: casjaysdev/android@sha256:40a926d7959f6bcaa635a6c4de2ede01f17071d8104af77723968522484b604e

variables:
  GIT_DEPTH: 0

# Gradle's own hashFiles-equivalent (GitHub-syntax providers) supports an
# arbitrary glob; GitLab's cache:key:files hashes up to two named files —
# closest native equivalent, not an exact port of the glob pattern.
.gradle_cache: &gradle_cache
  key:
    files:
      - app/build.gradle
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle-caches/
    - .gradle-wrapper/

.gradle_env: &gradle_env
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-caches"

# Reusable script fragments, pulled into jobs with the `!reference` tag
# (GitLab's documented mechanism for sharing script snippets — safer than
# relying on YAML anchors to flatten nested arrays).
.decode_keystore:
  script:
    - |
      if [ -z "$KEYSTORE_BASE64" ]; then
        echo "ERROR: KEYSTORE_BASE64 CI/CD variable is not set. Add it under Settings > CI/CD > Variables (protected, masked)." >&2
        exit 1
      fi
      if [ -z "$KEYSTORE_PASSWORD" ]; then
        echo "ERROR: KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD is missing. Add it under Settings > CI/CD > Variables." >&2
        exit 1
      fi
      printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
      echo "Keystore decoded and ready"

.fetch_native_libs:
  script:
    - chmod +x scripts/fetch-mosh-binaries.sh scripts/fetch-spice-libs.sh scripts/fetch-tor-binaries.sh scripts/fetch-fonts.sh
    - TABSSH_REPO="$CI_PROJECT_PATH" GH_TOKEN="$GH_TOKEN" scripts/fetch-mosh-binaries.sh
    - TABSSH_REPO="$CI_PROJECT_PATH" GH_TOKEN="$GH_TOKEN" scripts/fetch-spice-libs.sh
    - TABSSH_REPO="$CI_PROJECT_PATH" GH_TOKEN="$GH_TOKEN" scripts/fetch-tor-binaries.sh
    - scripts/fetch-fonts.sh

.verify_native_libs:
  script:
    - |
      for abi in arm64-v8a armeabi-v7a x86_64 x86; do
        for lib in libmosh-client.so libtabssh_native.so libtor.so; do
          if [ ! -f "app/src/main/jniLibs/$abi/$lib" ]; then
            echo "ERROR: $lib missing for $abi — every published build must bundle mosh, SPICE and Tor for all ABIs" >&2
            exit 1
          fi
        done
      done
      FONTS=$(ls app/src/main/assets/fonts/*.ttf 2>/dev/null | wc -l)
      if [ "$FONTS" -lt 9 ]; then
        echo "ERROR: Only $FONTS of 9 bundled Nerd Fonts present in assets/fonts" >&2
        exit 1
      fi

# No provenance-attestation fragment — actions/attest-build-provenance is
# GitHub-only (AI.md PART 13 release-channel skeleton).
.stage_release_assets:
  script:
    - |
      mkdir -p dist
      cp app/build/outputs/apk/${BUILD_FLAVOR}/*-android-*.apk dist/
      PROJECT_NAME="$(basename "$(ls dist/*-android-universal.apk | head -1)" -android-universal.apk)"
      cp app/build/outputs/mapping/${BUILD_FLAVOR}/mapping.txt dist/mapping.txt
      printf 'version: %s\ncommit: %s\nbuild_epoch: %s\n' \
        "${VERSION_IDENTITY}" "$(git rev-parse HEAD)" "${BUILD_EPOCH}" > dist/version.txt
      git archive --format=tar.gz -o "dist/${PROJECT_NAME}-${VERSION_IDENTITY}-source.tar.gz" HEAD
      SBOM=$(find app/build \( -name '*.json' -a -path '*cyclonedx*' \) -o -name 'bom.json' | head -1)
      if [ -z "$SBOM" ]; then
        echo "ERROR: CycloneDX SBOM not found under app/build" >&2
        exit 1
      fi
      cp "$SBOM" dist/${PROJECT_NAME}-sbom.cdx.json
      cd dist
      sha256sum -- * > sha256.txt.tmp && mv sha256.txt.tmp sha256.txt
      sha512sum -- * | grep -v -- ' sha256.txt$' > sha512.txt.tmp && mv sha512.txt.tmp sha512.txt
      ls -lh
      cd ..

# ── build + test + security stages (ci.yml equivalent) ─────────────────

validate:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
  before_script:
    - chmod +x gradlew
  script:
    - export BUILD_EPOCH="$(date -u +%s)"
    - ./gradlew kspDebugKotlin compileDebugKotlin lintDebug testDebugUnitTest --no-daemon
    - |
      test -f "app/build.gradle" && echo "App build.gradle exists"
      test -f "app/src/main/AndroidManifest.xml" && echo "AndroidManifest.xml exists"
      test -f "app/src/main/java/io/github/tabssh/TabSSHApplication.kt" && echo "Application class exists"
    - |
      for f in README.md CHANGELOG.md AI.md IDEA.md LICENSE.md; do
        if [ ! -f "$f" ]; then
          echo "ERROR: $f missing" >&2
          exit 1
        fi
      done
      if git ls-files | grep -E '(\.jks|\.keystore)$|(^|/)\.env' | grep -v -- '\.env\.example$' | grep -q .; then
        echo "ERROR: a keystore or .env file is tracked by git" >&2
        exit 1
      fi
      APP_ID="$(sed -n 's/^app_id:[[:space:]]*//p' IDEA.md | head -1)"
      GRADLE_ID="$(sed -n 's/^[[:space:]]*applicationId[[:space:]]*["'"'"']\([^"'"'"']*\)["'"'"'].*/\1/p' app/build.gradle | head -1)"
      if [ -z "$APP_ID" ] || [ "$APP_ID" != "$GRADLE_ID" ]; then
        echo "ERROR: applicationId '$GRADLE_ID' does not match IDEA.md app_id '$APP_ID'" >&2
        exit 1
      fi

secret-scan:
  stage: security
  # Digest-pinned, not :latest — same rule as the default image above.
  image: trufflesecurity/trufflehog@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "web" ] || [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        trufflehog git file://. --results=verified --exclude-paths=.github/trufflehog-exclude.txt --fail
      else
        trufflehog git file://. --since-commit HEAD~1 --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt --fail
      fi

workflow-policy:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      fail=0
      while IFS= read -r line; do
        image=$(printf '%s' "$line" | sed -E 's/.*image:[[:space:]]*//')
        case "$image" in
          *@sha256:*) ;;
          *)
            echo "ERROR: UNPINNED image (no digest): $line" >&2
            fail=1
            ;;
        esac
      done < <(grep -rhnE '^\s*image:' .gitlab-ci.yml)
      if [ $fail -ne 0 ]; then
        echo "ERROR: every job/service image must be pinned by digest, never :latest" >&2
        exit 1
      fi
      echo "OK: all pinned images use a digest"

dependency-check:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
  before_script:
    - chmod +x gradlew
  script:
    # CVSS >= 7.0 fails the build; suppressions come from the shared file
    - |
      if [ -z "${NVD_API_KEY:-}" ]; then
        echo "DependencyCheck skipped: NVD_API_KEY is not set"
      else
        ./gradlew dependencyCheckAggregate --no-daemon
      fi

# ── devel stage (devel.yml equivalent) ─────────────────────

devel:
  stage: release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
    BUILD_FLAVOR: devel
  before_script:
    - chmod +x gradlew
    - !reference [.decode_keystore, script]
  script:
    - COMMIT_HASH=$(git rev-parse --short=7 HEAD)
    - BUILD_EPOCH=$(date -u +%s)
    - VERSION="$COMMIT_HASH"
    - export VERSION VERSION_IDENTITY="$COMMIT_HASH" BUILD_EPOCH SOURCE_DATE_EPOCH="$BUILD_EPOCH"
    - !reference [.fetch_native_libs, script]
    - !reference [.verify_native_libs, script]
    - ./gradlew assembleDevel --no-daemon
    - ./gradlew :app:cyclonedxBom --no-daemon
    - !reference [.stage_release_assets, script]
    - |
      # Rolling release: delete + recreate as the final step, after the build and staging
      # succeeded (AI.md PART 13). The image ships only gh, curl and jq, so REST does the work.
      export PROVIDER=gitlab API_URL="$CI_API_V4_URL" REPO="$CI_PROJECT_ID" TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}" PACKAGE="$CI_PROJECT_NAME"
      printf "Devel build %s: rolling prerelease, not for production use.\n" "$COMMIT_HASH" > dist-release-notes.md
      bash scripts/provider-release.sh delete devel || true
      bash scripts/provider-release.sh create devel "Devel Build ${COMMIT_HASH}" dist-release-notes.md true "$CI_COMMIT_SHA" dist/*
  artifacts:
    paths:
      - dist/

# ── beta stage (beta.yml equivalent) ────────────────────────────────────

beta:
  stage: release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "beta"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
    BUILD_FLAVOR: release
  before_script:
    - chmod +x gradlew
    - !reference [.decode_keystore, script]
  script:
    - BUILD_EPOCH=$(date -u +%s)
    - TAG_NAME="$(date -u -d "@${BUILD_EPOCH}" +%Y%m%d%H%M%S)-beta"
    - VERSION="$TAG_NAME"
    - export VERSION VERSION_IDENTITY="$TAG_NAME" BUILD_EPOCH SOURCE_DATE_EPOCH="$BUILD_EPOCH"
    - !reference [.fetch_native_libs, script]
    - !reference [.verify_native_libs, script]
    - ./gradlew assembleRelease --no-daemon
    - ./gradlew :app:cyclonedxBom --no-daemon
    - !reference [.stage_release_assets, script]
    - cat CHANGELOG.md > dist-release-notes.md
    - |
      export PROVIDER=gitlab API_URL="$CI_API_V4_URL" REPO="$CI_PROJECT_ID" TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}" PACKAGE="$CI_PROJECT_NAME"
      bash scripts/provider-release.sh create "$TAG_NAME" "$TAG_NAME" dist-release-notes.md true "$CI_COMMIT_SHA" dist/*
  artifacts:
    paths:
      - dist/

# ── release stage (release.yml equivalent) ──────────────────────────────

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_TAG =~ /^[^ ]+\.[^ ]+\.[^ ]+$/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
    BUILD_FLAVOR: release
  before_script:
    - chmod +x gradlew
    - !reference [.decode_keystore, script]
  script:
    - |
      if [ -z "${CI_COMMIT_TAG:-}" ]; then
        echo "ERROR: the release job must run from a tag, got none. Push a vX.Y.Z tag, or start the pipeline from a tag." >&2
        exit 1
      fi
      if printf '%s' "$CI_COMMIT_TAG" | LC_ALL=C grep -q '[[:space:][:cntrl:]]'; then
        echo "ERROR: the tag name contains whitespace or control characters. Delete the tag and push a clean vX.Y.Z tag." >&2
        exit 1
      fi
    - ./gradlew test --no-daemon
    # Aggregate, not Analyze: the plugin is applied to the root project,
    # which declares no dependencies of its own — dependencyCheckAnalyze
    # would scan an empty configuration set. Aggregate walks :app too.
    # CVSS >= 7.0 fails the build; suppressions read from the shared
    # .github/dependency-check-suppressions.xml path (AI.md PART 12).
    - |
      if [ -z "${NVD_API_KEY:-}" ]; then
        echo "DependencyCheck skipped: NVD_API_KEY is not set"
      else
        ./gradlew dependencyCheckAggregate --no-daemon
      fi
    - ./gradlew jacocoTestReport jacocoTestCoverageVerification --no-daemon
    - TAG_NAME="$CI_COMMIT_TAG"
    - VERSION="${TAG_NAME#v}"
    - BUILD_EPOCH=$(date -u +%s)
    - export VERSION VERSION_IDENTITY="$VERSION" BUILD_EPOCH SOURCE_DATE_EPOCH="$BUILD_EPOCH" RELEASE_BUILD=true
    - !reference [.fetch_native_libs, script]
    - !reference [.verify_native_libs, script]
    - ./gradlew assembleRelease --no-daemon
    - ./gradlew assembleFdroidRelease --no-daemon
    - ./gradlew :app:cyclonedxBom --no-daemon
    - !reference [.stage_release_assets, script]
    - cat CHANGELOG.md > dist-release-notes.md
    - |
      export PROVIDER=gitlab API_URL="$CI_API_V4_URL" REPO="$CI_PROJECT_ID" TOKEN="${GITLAB_TOKEN:-$CI_JOB_TOKEN}" PACKAGE="$CI_PROJECT_NAME"
      bash scripts/provider-release.sh delete "$TAG_NAME" || true
      bash scripts/provider-release.sh create "$TAG_NAME" "v$VERSION" dist-release-notes.md false "$CI_COMMIT_SHA" dist/*
    - ./scripts/notify-release.sh "$TAG_NAME"
  artifacts:
    paths:
      - dist/
