# GitLab CI mirror of .github/workflows/{ci,security,beta,release,development}.yml
# (AI.md PART 12). Same gates, GitLab syntax: build/test/security stages
# cover ci.yml; development/beta/release each get their own stage, tag- or
# schedule-triggered, running the canonical release skeleton (AI.md
# PART 13). All jobs run in casjaysdev/android:latest — no inline tool
# install.

stages:
  - build
  - test
  - security
  - development
  - beta
  - release

default:
  # Pinned by digest per AI.md PART 12 / cicd_conventions.md (GitLab: no
  # `:latest` in production CI jobs) — Renovate tracks and bumps this
  # digest the same way it bumps SHA-pinned GitHub Actions.
  image: casjaysdev/android@sha256:40a926d7959f6bcaa635a6c4de2ede01f17071d8104af77723968522484b604e

variables:
  GIT_DEPTH: 0

# Gradle's own hashFiles-equivalent (GitHub-syntax providers) supports an
# arbitrary glob; GitLab's cache:key:files hashes up to two named files —
# closest native equivalent, not an exact port of the glob pattern.
.gradle_cache: &gradle_cache
  key:
    files:
      - app/build.gradle
      - gradle/wrapper/gradle-wrapper.properties
  paths:
    - .gradle-caches/
    - .gradle-wrapper/

.gradle_env: &gradle_env
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-caches"

# Reusable script fragments, pulled into jobs with the `!reference` tag
# (GitLab's documented mechanism for sharing script snippets — safer than
# relying on YAML anchors to flatten nested arrays).
.decode_keystore:
  script:
    - |
      if [ -z "$KEYSTORE_BASE64" ]; then
        echo "ERROR: KEYSTORE_BASE64 CI/CD variable is not set. Add it under Settings > CI/CD > Variables (protected, masked)." >&2
        exit 1
      fi
      if [ -z "$KEYSTORE_PASSWORD" ]; then
        echo "ERROR: KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD is missing. Add it under Settings > CI/CD > Variables." >&2
        exit 1
      fi
      printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
      echo "Keystore decoded and ready"

.fetch_native_libs:
  script:
    - chmod +x scripts/fetch-mosh-binaries.sh scripts/fetch-spice-libs.sh scripts/fetch-tor-binaries.sh scripts/fetch-fonts.sh
    - TABSSH_REPO="tabssh/android" GH_TOKEN="$GH_TOKEN" scripts/fetch-mosh-binaries.sh
    - TABSSH_REPO="tabssh/android" GH_TOKEN="$GH_TOKEN" scripts/fetch-spice-libs.sh
    - TABSSH_REPO="tabssh/android" GH_TOKEN="$GH_TOKEN" scripts/fetch-tor-binaries.sh
    - scripts/fetch-fonts.sh

.verify_native_libs:
  script:
    - |
      for abi in arm64-v8a armeabi-v7a x86_64 x86; do
        for lib in libmosh-client.so libtabssh_native.so libtor.so; do
          if [ ! -f "app/src/main/jniLibs/$abi/$lib" ]; then
            echo "ERROR: $lib missing for $abi — every published build must bundle mosh, SPICE and Tor for all ABIs" >&2
            exit 1
          fi
        done
      done
      FONTS=$(ls app/src/main/assets/fonts/*.ttf 2>/dev/null | wc -l)
      if [ "$FONTS" -lt 9 ]; then
        echo "ERROR: Only $FONTS of 9 bundled Nerd Fonts present in assets/fonts" >&2
        exit 1
      fi

# No provenance-attestation fragment — actions/attest-build-provenance is
# GitHub-only (AI.md PART 13 release-channel skeleton).
.stage_release_assets:
  script:
    - |
      mkdir -p dist
      cp app/build/outputs/apk/${BUILD_FLAVOR}/tabssh-android-*.apk dist/
      cp app/build/outputs/mapping/${BUILD_FLAVOR}/mapping.txt dist/mapping.txt
      printf 'version: %s\ncommit: %s\nbuild_epoch: %s\n' \
        "${VERSION_IDENTITY}" "$(git rev-parse HEAD)" "${BUILD_EPOCH}" > dist/version.txt
      git archive --format=tar.gz -o "dist/tabssh-${VERSION_IDENTITY}-source.tar.gz" HEAD
      SBOM=$(find app/build \( -name '*.json' -a -path '*cyclonedx*' \) -o -name 'bom.json' | head -1)
      if [ -z "$SBOM" ]; then
        echo "ERROR: CycloneDX SBOM not found under app/build" >&2
        exit 1
      fi
      cp "$SBOM" dist/tabssh-sbom.cdx.json
      cd dist
      sha256sum -- * > sha256.txt.tmp && mv sha256.txt.tmp sha256.txt
      sha512sum -- * | grep -v -- ' sha256.txt$' > sha512.txt.tmp && mv sha512.txt.tmp sha512.txt
      ls -lh
      cd ..

# ── build + test + security stages (ci.yml equivalent) ─────────────────

validate:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
  before_script:
    - chmod +x gradlew
  script:
    - ./gradlew kspDebugKotlin compileDebugKotlin lintDebug testDebugUnitTest --no-daemon
    - |
      test -f "app/build.gradle" && echo "App build.gradle exists"
      test -f "app/src/main/AndroidManifest.xml" && echo "AndroidManifest.xml exists"
      test -f "app/src/main/java/io/github/tabssh/TabSSHApplication.kt" && echo "Application class exists"
    - |
      for f in README.md CHANGELOG.md AI.md IDEA.md; do
        if [ ! -f "$f" ]; then
          echo "ERROR: $f missing" >&2
          exit 1
        fi
      done

secret-scan:
  stage: security
  # Digest-pinned, not :latest — same rule as the default image above.
  image: trufflesecurity/trufflehog@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - trufflehog git file://. --since-commit "$CI_COMMIT_BEFORE_SHA" --branch "$CI_COMMIT_REF_NAME" --results=verified,unknown --fail

workflow-policy:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - |
      fail=0
      while IFS= read -r line; do
        image=$(printf '%s' "$line" | sed -E 's/.*image:[[:space:]]*//')
        case "$image" in
          *@sha256:*) ;;
          *)
            echo "ERROR: UNPINNED image (no digest): $line" >&2
            fail=1
            ;;
        esac
      done < <(grep -rhnE '^\s*image:' .gitlab-ci.yml)
      if [ $fail -ne 0 ]; then
        echo "ERROR: every job/service image must be pinned by digest, never :latest" >&2
        exit 1
      fi
      echo "OK: all pinned images use a digest"

# ── development stage (development.yml equivalent) ─────────────────────

development:
  stage: development
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
    BUILD_FLAVOR: devel
  before_script:
    - chmod +x gradlew
    - !reference [.decode_keystore, script]
  script:
    - COMMIT_HASH=$(git rev-parse --short=7 HEAD)
    - BUILD_EPOCH=$(date -u +%s)
    - export VERSION_IDENTITY="$COMMIT_HASH" BUILD_EPOCH SOURCE_DATE_EPOCH="$BUILD_EPOCH"
    - !reference [.fetch_native_libs, script]
    - !reference [.verify_native_libs, script]
    - ./gradlew assembleDevel --no-daemon
    - ./gradlew :app:cyclonedxBom --no-daemon
    - !reference [.stage_release_assets, script]
    - |
      # Rolling release: delete + recreate on every run (AI.md PART 13).
      glab release delete development --yes || echo "No existing development release found"
      git push origin :refs/tags/development || echo "No development tag to delete"
      glab release create development dist/* \
        --name "devel-${COMMIT_HASH}" \
        --notes "Development build devel-${COMMIT_HASH} — rolling prerelease, not for production use." \
        --ref "$(git rev-parse HEAD)"
  artifacts:
    paths:
      - dist/

# ── beta stage (beta.yml equivalent) ────────────────────────────────────

beta:
  stage: beta
  rules:
    - if: '$CI_COMMIT_TAG =~ /beta/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
    BUILD_FLAVOR: release
  before_script:
    - chmod +x gradlew
    - !reference [.decode_keystore, script]
  script:
    - TAG_NAME="$CI_COMMIT_TAG"
    - BUILD_EPOCH=$(date -u +%s)
    - export VERSION_IDENTITY="$TAG_NAME" BUILD_EPOCH SOURCE_DATE_EPOCH="$BUILD_EPOCH"
    - !reference [.fetch_native_libs, script]
    - !reference [.verify_native_libs, script]
    - ./gradlew assembleRelease --no-daemon
    - ./gradlew :app:cyclonedxBom --no-daemon
    - !reference [.stage_release_assets, script]
    - cat CHANGELOG.md > dist-release-notes.md
    - |
      glab release create "$TAG_NAME" dist/* \
        --name "TabSSH $TAG_NAME (beta)" \
        --notes-file dist-release-notes.md
  artifacts:
    paths:
      - dist/

# ── release stage (release.yml equivalent) ──────────────────────────────

release:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]/'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  cache:
    <<: *gradle_cache
  variables:
    <<: *gradle_env
    BUILD_FLAVOR: release
  before_script:
    - chmod +x gradlew
    - !reference [.decode_keystore, script]
  script:
    - ./gradlew test --no-daemon
    # Aggregate, not Analyze: the plugin is applied to the root project,
    # which declares no dependencies of its own — dependencyCheckAnalyze
    # would scan an empty configuration set. Aggregate walks :app too.
    # CVSS >= 7.0 fails the build; suppressions read from the shared
    # .github/dependency-check-suppressions.xml path (AI.md PART 12).
    - ./gradlew dependencyCheckAggregate --no-daemon
    - ./gradlew jacocoTestReport jacocoTestCoverageVerification --no-daemon
    - TAG_NAME="$CI_COMMIT_TAG"
    - VERSION="${TAG_NAME#v}"
    - BUILD_EPOCH=$(date -u +%s)
    - export VERSION_IDENTITY="$VERSION" BUILD_EPOCH SOURCE_DATE_EPOCH="$BUILD_EPOCH" RELEASE_BUILD=true
    - !reference [.fetch_native_libs, script]
    - !reference [.verify_native_libs, script]
    - ./gradlew assembleRelease --no-daemon
    - ./gradlew assembleFdroidRelease --no-daemon
    - ./gradlew :app:cyclonedxBom --no-daemon
    - !reference [.stage_release_assets, script]
    - cat CHANGELOG.md > dist-release-notes.md
    - |
      glab release delete "$TAG_NAME" --yes || echo "Release $TAG_NAME not found"
      glab release create "$TAG_NAME" dist/* \
        --name "TabSSH $VERSION - Complete Mobile SSH Client" \
        --notes-file dist-release-notes.md
    - ./scripts/notify-release.sh "$TAG_NAME"
  artifacts:
    paths:
      - dist/
