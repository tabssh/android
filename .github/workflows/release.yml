name: Production Release

# ─────────────────────────────────────────────────────────────────────────
# RELEASE CHANNEL: stable (AI.md PART 12/13)
#
# Fires on push of a `v*` tag (e.g. v0.0.9, v1.0.0). Runs the full test +
# DependencyCheck + coverage gates, builds the `release` variant, then
# publishes the canonical asset set as a non-prerelease GitHub release.
# Version identity is the tag without the `v` prefix; asset names are
# identical across channels — channel identity lives in the tag, the
# release object, and version.txt, never in mutated filenames.
#
# The other channels: development.yml (rolling `development` prerelease)
# and beta.yml (tag *beta, prerelease).
#
# `mosh-binaries.yml` and `spice-libs.yml` produce build-infra-only channels:
# their releases are marked prerelease and don't appear on the repo's main
# page — they're consumed at build time by `scripts/fetch-mosh-binaries.sh`
# and `scripts/fetch-spice-libs.sh` respectively.
# ─────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

# Group by tag ref — re-pushing the same tag cancels any in-flight rebuild
# for that tag, but distinct version tags pushed back-to-back each get to
# complete and publish their own release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Pull-only, fail-fast gate: the release runs inside this image, so if it is
  # missing we stop immediately rather than provisioning a toolchain inline.
  ensure-build-image:
    name: Ensure build image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pull.outputs.image }}
    steps:
    - id: pull
      name: Pull build image (fail fast if missing)
      run: |
        IMAGE="casjaysdev/android:latest"
        if ! docker pull "$IMAGE"; then
          echo "::error::Build image $IMAGE could not be pulled from Docker Hub."
          exit 1
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  release:
    name: Build & Publish Release
    needs: ensure-build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: ${{ needs.ensure-build-image.outputs.image }}
    # Actions can't detect bash inside a container image and falls back to
    # `sh -e` for every `run:` step unless told otherwise.
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Trust the checked-out workspace inside the container
      # The container runs as a different UID than whatever created
      # the mounted checkout, so git refuses it as "dubious ownership"
      # the moment a later step runs a git command.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Gradle cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Decode and setup keystore
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        # Read secrets from the environment, never via GitHub expression
        # interpolation inside the script body — interpolation splices the
        # value into the generated shell text, where a newline or quote in
        # the secret becomes executable script.
        if [ -z "$KEYSTORE_B64" ]; then
          echo "::error::KEYSTORE_BASE64 secret is not set. Add it under repo Settings > Secrets and Variables > Actions." >&2
          exit 1
        fi
        if [ -z "$KEYSTORE_PW" ]; then
          echo "::error::KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD is missing. Add it under repo Settings > Secrets and Variables > Actions." >&2
          exit 1
        fi
        printf '%s' "$KEYSTORE_B64" | base64 -d > keystore.jks
        echo "✅ Keystore decoded and ready"

    - name: Run all tests
      run: ./gradlew test --no-daemon

    - name: Run security scan
      env:
        NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # Aggregate, not Analyze: the plugin is applied to the root project,
      # which declares no dependencies of its own — dependencyCheckAnalyze
      # therefore scanned an empty configuration set and failBuildOnCVSS
      # could never fire. Aggregate walks :app as well.
      run: ./gradlew dependencyCheckAggregate --no-daemon

    - name: Verify test coverage
      run: ./gradlew jacocoTestReport jacocoTestCoverageVerification --no-daemon

    - name: Capture build identity
      id: version
      run: |
        # Stable-channel version identity is the tag without the `v` prefix
        # (AI.md PART 13). BUILD_EPOCH is captured exactly once here and
        # exported as SOURCE_DATE_EPOCH so BuildConfig.BUILD_EPOCH matches
        # version.txt.
        TAG_NAME=${GITHUB_REF#refs/tags/}
        VERSION=${TAG_NAME#v}
        BUILD_EPOCH=$(date -u +%s)
        echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "BUILD_EPOCH=${BUILD_EPOCH}" >> "$GITHUB_OUTPUT"
        echo "📦 Building release for tag: ${TAG_NAME} (version ${VERSION})"

    - name: Fetch latest mosh-client binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Pulls latest mosh-X.Y.Z release assets from this repo and drops
        # them into app/src/main/jniLibs/<abi>/libmosh-client.so. Won't fail
        # the build if no release exists yet (workflow `mosh-binaries.yml`
        # publishes them on a monthly cadence).
        chmod +x scripts/fetch-mosh-binaries.sh
        TABSSH_REPO="${{ github.repository }}" scripts/fetch-mosh-binaries.sh

    - name: Fetch latest SPICE native libraries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Pulls latest spice-libs-X.Y.Z release assets and drops them into
        # app/src/main/jniLibs/<abi>/libtabssh_native.so. Won't fail the build
        # if no release exists yet — SpiceLoader gates on load and falls back
        # to VNC (workflow `spice-libs.yml` publishes these manually).
        chmod +x scripts/fetch-spice-libs.sh
        TABSSH_REPO="${{ github.repository }}" scripts/fetch-spice-libs.sh

    - name: Fetch latest tor binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Pulls latest tor-X.Y.Z.W release assets and drops them into
        # app/src/main/jniLibs/<abi>/libtor.so. Won't fail the build if no
        # release exists yet — TorNativeClient.isAvailable() gates the built-in
        # Tor route out at runtime (workflow `tor-binaries.yml` publishes them
        # on a monthly cadence).
        chmod +x scripts/fetch-tor-binaries.sh
        TABSSH_REPO="${{ github.repository }}" scripts/fetch-tor-binaries.sh

    - name: Fetch Nerd Fonts
      run: |
        chmod +x scripts/fetch-fonts.sh
        scripts/fetch-fonts.sh

    # Published builds must never silently ship without mosh, SPICE, Tor, or
    # the bundled fonts — the fetch steps above soft-fail by design, so gate here.
    - name: Verify bundled mosh/SPICE/Tor/fonts are present
      run: |
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          for lib in libmosh-client.so libtabssh_native.so libtor.so; do
            if [ ! -f "app/src/main/jniLibs/$abi/$lib" ]; then
              echo "::error::$lib missing for $abi — every published build must bundle mosh, SPICE and Tor for all ABIs" >&2
              exit 1
            fi
          done
        done
        FONTS=$(ls app/src/main/assets/fonts/*.ttf 2>/dev/null | wc -l)
        if [ "$FONTS" -lt 9 ]; then
          echo "::error::Only $FONTS of 9 bundled Nerd Fonts present in assets/fonts" >&2
          exit 1
        fi

    - name: Build release APK
      run: ./gradlew assembleRelease --no-daemon
      env:
        RELEASE_BUILD: true
        SOURCE_DATE_EPOCH: ${{ steps.version.outputs.BUILD_EPOCH }}
        # KEYSTORE_PASSWORD is required to sign. KEY_PASSWORD is optional —
        # when the secret is absent GitHub expands it to an empty string and
        # build.gradle uses the store password for the key, which is how this
        # project's release keystore was generated.
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Build F-Droid compatible APK (sanity check, not uploaded)
      run: |
        # Smoke test: ensure proguard-fdroid.pro and the fdroidRelease build
        # type still build successfully. F-Droid distributes via their own
        # build infrastructure (cloning the source, building on F-Droid
        # servers, signing with F-Droid keys), so we never upload the APK
        # ourselves — uploading our-key-signed F-Droid builds to GitHub
        # would just be a confusing duplicate that nobody can use.
        ./gradlew assembleFdroidRelease --no-daemon
        echo "✅ F-Droid build succeeded — proguard-fdroid.pro is healthy"
        ls -lh app/build/outputs/apk/fdroidRelease/*.apk

    - name: Generate SBOM
      run: ./gradlew :app:cyclonedxBom --no-daemon

    - name: Stage release assets
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        BUILD_EPOCH: ${{ steps.version.outputs.BUILD_EPOCH }}
      run: |
        # Canonical channel flow (AI.md PART 13): stage APK splits +
        # mapping.txt -> version.txt -> source archive -> SBOM -> aggregate
        # sha256.txt/sha512.txt computed LAST over every staged asset —
        # never per-artifact checksum sidecars.
        mkdir -p dist
        cp app/build/outputs/apk/release/tabssh-android-*.apk dist/
        cp app/build/outputs/mapping/release/mapping.txt dist/mapping.txt

        printf 'version: %s\ncommit: %s\nbuild_epoch: %s\n' \
          "${VERSION}" "$(git rev-parse HEAD)" "${BUILD_EPOCH}" > dist/version.txt

        git archive --format=tar.gz -o "dist/tabssh-${VERSION}-source.tar.gz" HEAD

        # Parenthesised: without them find parses this as
        # (-name '*.json' -a -path '*cyclonedx*') -o (-name 'bom.json'),
        # so an unrelated bom.json anywhere under app/build could win.
        SBOM=$(find app/build \( -name '*.json' -a -path '*cyclonedx*' \) -o -name 'bom.json' | head -1)
        if [ -z "$SBOM" ]; then
          echo "::error::CycloneDX SBOM not found under app/build" >&2
          exit 1
        fi
        cp "$SBOM" dist/tabssh-sbom.cdx.json

        cd dist
        sha256sum -- * > sha256.txt.tmp && mv sha256.txt.tmp sha256.txt
        sha512sum -- * | grep -v -- ' sha256.txt$' > sha512.txt.tmp && mv sha512.txt.tmp sha512.txt
        ls -lh

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    - name: Generate release notes
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        {
          echo "# TabSSH ${VERSION} - Complete Mobile SSH Client"
          echo ""
          echo "## 📦 Downloads"
          echo "- **tabssh-android-universal.apk** - Recommended (works on all devices)"
          echo "- **tabssh-android-arm64.apk** - Modern ARM 64-bit devices"
          echo "- **tabssh-android-arm.apk** - Older ARM 32-bit devices"
          echo "- **tabssh-android-amd64.apk** - x86_64 (emulators, Chromebooks)"
          echo "- **tabssh-android-x86.apk** - x86 32-bit (older emulators)"
          echo ""
          echo "Checksums: see \`sha256.txt\` / \`sha512.txt\` release assets."
          echo ""
        } > RELEASE_NOTES.md
        cat CHANGELOG.md >> RELEASE_NOTES.md

    - name: Delete existing release if exists
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
      run: |
        # Re-pushing the same tag rebuilds and republishes it — delete the
        # stale release object first so asset uploads can't collide.
        gh release delete "$TAG_NAME" --yes || echo "Release $TAG_NAME not found"
        echo "✅ Cleanup complete, ready to create new release"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: "TabSSH ${{ steps.version.outputs.VERSION }} - Complete Mobile SSH Client"
        tag_name: ${{ steps.version.outputs.TAG_NAME }}
        files: dist/*
        body_path: RELEASE_NOTES.md
        generate_release_notes: false
        prerelease: false
        draft: false

    - name: Notify community
      env:
        MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
        MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      run: |
        # Send release notifications
        ./scripts/notify-release.sh "${{ github.ref_name }}"

    # Gradle creates .gradle/configuration-cache and daemon dirs mode 700.
    # This job runs as root inside the toolchain container, so those dirs
    # end up root-owned on the host runner — the host-side post-step
    # hashFiles() walk for the Gradle cache key then fails with EACCES
    # ("Fail to hash files") and marks the job failed even when every
    # build step passed. Make the tree world-readable before post steps.
    - name: Fix workspace permissions for host post-steps
      if: always()
      run: chmod -R a+rX "$GITHUB_WORKSPACE"
