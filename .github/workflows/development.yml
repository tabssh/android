name: Development Build

# ─────────────────────────────────────────────────────────────────────────
# RELEASE CHANNEL: development (AI.md PART 12/13)
#
# Daily schedule + every push to main. Builds the `devel` variant —
# release configuration (R8, shrinkResources, signed, NOT debuggable —
# a debuggable sideloaded APK trips Play Protect's "tries to bypass
# Android's security protections" heuristic) with devel/debug features
# and the Debug Log force-enabled via BuildConfig flags (DEVEL,
# DEBUG_LOG). Publishes the canonical asset set to the rolling
# `development` prerelease: release and tag are deleted and recreated
# on every run. Version identity is the short commit id; asset names
# are identical across channels — channel identity lives in the tag,
# the release object, and version.txt, never in mutated filenames.
#
# The other channels: beta.yml (tag *beta) and release.yml (tag v*).
# ─────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [ main ]

# Only one development build at a time — cancel any in-flight run when a
# newer push arrives so we don't race on the rolling `development` tag.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Pull-only, fail-fast gate: the build runs inside this image, so if it is
  # missing we stop immediately rather than provisioning a toolchain inline.
  ensure-build-image:
    name: Ensure build image
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      image: ${{ steps.pull.outputs.image }}
    steps:
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - id: pull
      name: Pull build image (fail fast if missing)
      run: |
        IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:build"
        if ! docker pull "$IMAGE"; then
          echo "::error::Build image $IMAGE not found."
          echo "::error::Trigger the 'Build Toolchain Image' workflow (workflow_dispatch) to create it."
          exit 1
        fi
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build-devel:
    name: Build Development APKs
    needs: ensure-build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    container:
      image: ${{ needs.ensure-build-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Actions can't detect bash inside a container image and falls back to
    # `sh -e` for every `run:` step unless told otherwise.
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Trust the checked-out workspace inside the container
      # The container runs as a different UID than whatever created
      # the mounted checkout, so git refuses it as "dubious ownership"
      # the moment a later step runs `git rev-parse`/`git log`.
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Gradle cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Decode and setup keystore
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        # Default to the legacy password so the ephemeral keystore matches the
        # build.gradle fallback; if a KEYSTORE_PASSWORD secret is later added it
        # is used for both, keeping the generated keystore and gradle in sync.
        KEYSTORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
      run: |
        # KEYSTORE_BASE64 is optional for dev builds. When set, decode it
        # so APKs are signed with the real release key (required for OTA
        # updates). When absent (e.g. a fork or first-time contributor),
        # generate an ephemeral self-signed keystore so the build doesn't
        # fail — the APK will be installable but won't match production
        # signatures (install via `adb install -r` or fresh install).
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > keystore.jks
          echo "✅ Keystore decoded from KEYSTORE_BASE64 secret"
        else
          echo "⚠️  KEYSTORE_BASE64 not set — generating ephemeral self-signed keystore for dev build"
          EPHEMERAL_PW="${KEYSTORE_PW:-tabssh123}"
          keytool -genkeypair \
            -keystore keystore.jks \
            -alias tabssh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 365 \
            -storepass "$EPHEMERAL_PW" \
            -keypass "$EPHEMERAL_PW" \
            -dname "CN=TabSSH Dev Build, OU=Dev, O=TabSSH, L=Unknown, ST=Unknown, C=US" \
            -noprompt
          echo "✅ Ephemeral debug keystore generated"
        fi

    - name: Capture build identity
      id: version
      run: |
        # Development-channel version identity is the short commit id
        # (AI.md PART 13) — real semver versions are reserved for tags.
        # BUILD_EPOCH is captured exactly once here and exported as
        # SOURCE_DATE_EPOCH so BuildConfig.BUILD_EPOCH matches version.txt.
        COMMIT_HASH=$(git rev-parse --short HEAD)
        BUILD_EPOCH=$(date -u +%s)
        echo "COMMIT_HASH=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
        echo "BUILD_EPOCH=${BUILD_EPOCH}" >> "$GITHUB_OUTPUT"
        echo "RELEASE_TITLE=devel-${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
        echo "📦 Building development release: devel-${COMMIT_HASH}"

    - name: Fetch latest mosh-client binaries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Pulls latest mosh-X.Y.Z release assets from this repo and drops
        # them into app/src/main/jniLibs/<abi>/libmosh-client.so. Won't fail
        # the build if no release exists yet (workflow `mosh-binaries.yml`
        # publishes them on a monthly cadence).
        chmod +x scripts/fetch-mosh-binaries.sh
        TABSSH_REPO="${{ github.repository }}" scripts/fetch-mosh-binaries.sh

    - name: Fetch latest SPICE native libraries
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Pulls latest spice-libs-X.Y.Z release assets and drops them into
        # app/src/main/jniLibs/<abi>/libtabssh_native.so. Won't fail the build
        # if no release exists yet — SpiceLoader gates on load and falls back
        # to VNC (workflow `spice-libs.yml` publishes these manually).
        chmod +x scripts/fetch-spice-libs.sh
        TABSSH_REPO="${{ github.repository }}" scripts/fetch-spice-libs.sh

    - name: Fetch Nerd Fonts
      run: |
        chmod +x scripts/fetch-fonts.sh
        scripts/fetch-fonts.sh

    # Published builds must never silently ship without mosh, SPICE, or the
    # bundled fonts — the fetch steps above soft-fail by design, so gate here.
    - name: Verify bundled mosh/SPICE/fonts are present
      run: |
        for abi in arm64-v8a armeabi-v7a x86_64 x86; do
          for lib in libmosh-client.so libtabssh_native.so; do
            if [ ! -f "app/src/main/jniLibs/$abi/$lib" ]; then
              echo "::error::$lib missing for $abi — every published build must bundle mosh and SPICE for all ABIs" >&2
              exit 1
            fi
          done
        done
        FONTS=$(ls app/src/main/assets/fonts/*.ttf 2>/dev/null | wc -l)
        if [ "$FONTS" -lt 9 ]; then
          echo "::error::Only $FONTS of 9 bundled Nerd Fonts present in assets/fonts" >&2
          exit 1
        fi

    - name: Build devel-variant APKs
      # assembleDevel (AI.md PART 4): release configuration — signed, R8,
      # NOT debuggable — with DEVEL/DEBUG_LOG BuildConfig flags forced on.
      run: ./gradlew assembleDevel --no-daemon
      env:
        SOURCE_DATE_EPOCH: ${{ steps.version.outputs.BUILD_EPOCH }}
        # Passed through so a future KEYSTORE_PASSWORD / KEY_PASSWORD secret is
        # picked up automatically. When absent GitHub expands to an empty string
        # and build.gradle falls back to the current password — which matches the
        # ephemeral keystore generated in the "Decode and setup keystore" step.
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Generate SBOM
      run: ./gradlew :app:cyclonedxBom --no-daemon

    - name: Stage release assets
      env:
        COMMIT_HASH: ${{ steps.version.outputs.COMMIT_HASH }}
        BUILD_EPOCH: ${{ steps.version.outputs.BUILD_EPOCH }}
      run: |
        # Canonical channel flow (AI.md PART 13): stage APK splits +
        # mapping.txt -> version.txt -> source archive -> SBOM -> aggregate
        # sha256.txt/sha512.txt computed LAST over every staged asset.
        mkdir -p dist
        cp app/build/outputs/apk/devel/tabssh-android-*.apk dist/
        cp app/build/outputs/mapping/devel/mapping.txt dist/mapping.txt

        printf 'version: %s\ncommit: %s\nbuild_epoch: %s\n' \
          "${COMMIT_HASH}" "$(git rev-parse HEAD)" "${BUILD_EPOCH}" > dist/version.txt

        git archive --format=tar.gz -o "dist/tabssh-${COMMIT_HASH}-source.tar.gz" HEAD

        # Parenthesised: without them find parses this as
        # (-name '*.json' -a -path '*cyclonedx*') -o (-name 'bom.json'),
        # so an unrelated bom.json anywhere under app/build could win.
        SBOM=$(find app/build \( -name '*.json' -a -path '*cyclonedx*' \) -o -name 'bom.json' | head -1)
        if [ -z "$SBOM" ]; then
          echo "::error::CycloneDX SBOM not found under app/build" >&2
          exit 1
        fi
        cp "$SBOM" dist/tabssh-sbom.cdx.json

        cd dist
        sha256sum -- * > sha256.txt.tmp && mv sha256.txt.tmp sha256.txt
        sha512sum -- * | grep -v -- ' sha256.txt$' > sha512.txt.tmp && mv sha512.txt.tmp sha512.txt
        ls -lh

    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: dist/*

    - name: Generate release notes
      env:
        RELEASE_TITLE: ${{ steps.version.outputs.RELEASE_TITLE }}
        COMMIT_HASH: ${{ steps.version.outputs.COMMIT_HASH }}
      run: |
        BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

        cat > RELEASE_NOTES_DEV.md << EOF
        # TabSSH Development Build

        **⚠️ This is a development/testing build - Not for production use**

        ## Build Information

        - **Build:** ${RELEASE_TITLE}
        - **Commit:** ${COMMIT_HASH}
        - **Built:** ${BUILD_DATE}
        - **Variant:** devel (release configuration + Debug Log enabled, not debuggable)

        ## Downloads

        - **tabssh-android-universal.apk** - Recommended (works on all devices)
        - **tabssh-android-arm64.apk** - Modern ARM 64-bit devices
        - **tabssh-android-arm.apk** - Older ARM 32-bit devices
        - **tabssh-android-amd64.apk** - x86_64 (emulators, Chromebooks)
        - **tabssh-android-x86.apk** - x86 32-bit (older emulators)

        Checksums: see \`sha256.txt\` / \`sha512.txt\` release assets.

        ## Recent Commits

        EOF
        git log --pretty=format:"- %s (%h)" -10 >> RELEASE_NOTES_DEV.md
        cat >> RELEASE_NOTES_DEV.md << 'EOF'


        ## ⚠️ Important Notes

        - This is a **development build** for testing purposes
        - May contain bugs or unfinished features
        - Replaces the previous development build
        - Use official releases for stable versions

        ## Reporting Issues

        Found a bug? Report it: https://github.com/tabssh/android/issues
        EOF

    - name: Delete existing development release
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Rolling release: delete + recreate on every run (AI.md PART 13)
        gh release delete development --yes || echo "No existing development release found"
        git push origin :refs/tags/development || echo "No development tag to delete"

    - name: Create development release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: "${{ steps.version.outputs.RELEASE_TITLE }}"
        tag_name: development
        files: dist/*
        body_path: RELEASE_NOTES_DEV.md
        prerelease: true
        draft: false

    - name: Build summary
      env:
        RELEASE_TITLE: ${{ steps.version.outputs.RELEASE_TITLE }}
        COMMIT_HASH: ${{ steps.version.outputs.COMMIT_HASH }}
      run: |
        {
          echo "## 🎉 Development Build Complete!"
          echo ""
          echo "**Build:** ${RELEASE_TITLE}"
          echo "**Commit:** ${COMMIT_HASH}"
          echo ""
          echo "### 📦 Release assets:"
          echo ""
          for f in dist/*; do
            SIZE=$(du -h "$f" | cut -f1)
            echo "- \`$(basename "$f")\` ($SIZE)"
          done
          echo ""
          echo "### 🔗 Download:"
          echo ""
          echo "https://github.com/${{ github.repository }}/releases/tag/development"
        } >> "$GITHUB_STEP_SUMMARY"

    # Gradle creates .gradle/configuration-cache and daemon dirs mode 700.
    # This job runs as root inside the toolchain container, so those dirs
    # end up root-owned on the host runner — the host-side post-step
    # hashFiles() walk for the Gradle cache key then fails with EACCES
    # ("Fail to hash files") and marks the job failed even when every
    # build step passed. Make the tree world-readable before post steps.
    - name: Fix workspace permissions for host post-steps
      if: always()
      run: chmod -R a+rX "$GITHUB_WORKSPACE"
