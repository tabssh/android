name: SPICE Native Libraries

# Cross-compiles the SPICE client stack + TabSSH JNI bridge into a single
# libtabssh_native.so per Android ABI and publishes a GitHub release tagged
# `spice-libs-<version>`. Manual trigger only — the pinned dependency
# versions live in spice/Dockerfile, so there is no upstream feed to poll.
#
# Output: release `spice-libs-<version>` with assets:
#   - libtabssh_native-arm64-v8a.so
#   - libtabssh_native-armeabi-v7a.so
#   - libtabssh_native-x86_64.so
#   - libtabssh_native-x86.so
#
# `scripts/fetch-spice-libs.sh` consumes the latest such release at APK
# build time (drops files to app/src/main/jniLibs/<abi>/libtabssh_native.so).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Packaging version for the spice-libs-<version> release tag'
        required: false
        default: '0.42.0'

permissions:
  contents: write   # need write to create the release

jobs:
  build:
    name: Build libtabssh_native.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build cross-compile image
        run: |
          docker build -t tabssh/spice-build:latest spice/

      - name: Cross-compile SPICE stack for ${{ matrix.abi }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/spice:/work" \
            tabssh/spice-build:latest \
            /work/build-android.sh ${{ matrix.abi }}

      - name: Verify library
        run: |
          lib="spice/out/${{ matrix.abi }}/libtabssh_native.so"
          test -f "$lib" || { echo "Missing library"; exit 1; }
          file "$lib"
          ls -la "$lib"
          mkdir -p artifacts
          cp "$lib" "artifacts/libtabssh_native-${{ matrix.abi }}.so"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libtabssh_native-${{ matrix.abi }}
          path: artifacts/libtabssh_native-${{ matrix.abi }}.so
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected libraries
        run: ls -la artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          tag="spice-libs-${version}"

          # Replace any existing release with this tag so assets stay clean.
          gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            && gh release delete "$tag" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag \
            || true

          cat > /tmp/spice-release-notes.md <<EOF
          Cross-compiled \`libtabssh_native.so\` (SPICE client bridge) ${version} for Android, all four ABIs.

          Each library statically links the SPICE client stack (spice-gtk spice-client-glib, glib, pixman, openssl, opus) plus the TabSSH JNI bridge from \`spice/cpp/\`. They are bundled into the TabSSH APK at \`app/src/main/jniLibs/<abi>/libtabssh_native.so\` and unpacked to the app's \`nativeLibraryDir\` on install.

          **License:** spice-gtk and glib are LGPL-2.1+; they are dynamically aggregated with TabSSH (MIT) and statically linked into this standalone bridge library. See the respective upstream projects for full license terms.

          **Built from:** \`spice/Dockerfile\` + \`spice/build-android.sh\` in this repo (pinned dependency versions).
          EOF

          # Native-lib refreshes are infrastructure, not user-facing app
          # releases — mark prerelease so they don't claim the "Latest"
          # badge (reserved for actual TabSSH APK releases).
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SPICE native libs ${version} for Android" \
            --notes-file /tmp/spice-release-notes.md \
            --prerelease \
            artifacts/libtabssh_native-*.so
