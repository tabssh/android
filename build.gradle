// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.4.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'org.owasp.dependencycheck' version '12.2.2'
    // KSP — replaces Kapt for Room codegen. Since KSP 2.3.x the
    // version is decoupled from the Kotlin version (KSP2-only) and
    // supports a range of recent Kotlin releases; when bumping
    // Kotlin, check https://github.com/google/ksp/releases for the
    // newest KSP and bump it too.
    id 'com.google.devtools.ksp' version '2.3.10' apply false
}

// Repositories are now managed in settings.gradle

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

// Dependency security scanning configuration
dependencyCheck {
    format = 'ALL'
    suppressionFile = 'config/dependency-check-suppressions.xml'
    failBuildOnCVSS = 7.0

    // The legacy NVD feed was retired; the NVD API now requires a key
    // (https://nvd.nist.gov/developers/request-an-api-key) or lookups get
    // throttled to the point of failing CI. Never hardcode the key — read
    // it from the NVD_API_KEY env var (set as a repo secret in CI). Left
    // unset locally/without the secret, the plugin falls back to its
    // unauthenticated (throttled) NVD access, same as before this change.
    def nvdApiKey = System.getenv('NVD_API_KEY')
    if (nvdApiKey) {
        nvd {
            apiKey = nvdApiKey
        }
    }

    analyzers {
        experimentalEnabled = true
        archiveEnabled = true
        assemblyEnabled = false
    }
}
